<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">RestaurantAgent 플랫폼 AWS 인프라 아키텍처</title>
  <desc id="desc">브라우저 기반 RestaurantAgent, VPC 기반 CodingService, 로컬 dining-coder, CodePipeline 배포 흐름을 보여주는 아키텍처 다이어그램</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="awsHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#232f3e"/>
      <stop offset="1" stop-color="#37475a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff9900"/>
    </marker>
    <style>
      .title{font:700 30px 'Segoe UI','Noto Sans KR',sans-serif;fill:#fff}
      .subtitle{font:400 15px 'Segoe UI','Noto Sans KR',sans-serif;fill:#dbe5f0}
      .section{font:700 18px 'Segoe UI','Noto Sans KR',sans-serif;fill:#1e293b}
      .cardTitle{font:700 15px 'Segoe UI','Noto Sans KR',sans-serif;fill:#0f172a}
      .cardText{font:400 12px 'Segoe UI','Noto Sans KR',sans-serif;fill:#475569}
      .tiny{font:400 11px 'Segoe UI','Noto Sans KR',sans-serif;fill:#64748b}
      .label{font:600 11px 'Segoe UI','Noto Sans KR',sans-serif;fill:#475569}
      .white{fill:#fff}
      .flow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .deploy{stroke:#ff9900;stroke-width:2.4;stroke-dasharray:8 5;fill:none;marker-end:url(#arrowOrange)}
      .boundary{fill:#fff;stroke:#94a3b8;stroke-width:1.5}
      .vpc{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}
      .lane{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.3}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:1.3;filter:url(#shadow)}
      .serviceIcon{stroke:none}
    </style>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect x="24" y="20" width="1552" height="72" rx="14" fill="url(#awsHeader)" filter="url(#shadow)"/>
  <text x="54" y="54" class="title">RestaurantAgent Platform</text>
  <text x="54" y="78" class="subtitle">두 개의 독립 Amazon Bedrock AgentCore Runtime과 로컬 다중 에이전트 실험실을 연결한 AI Agent DevSecOps 아키텍처</text>
  <rect x="1355" y="38" width="180" height="36" rx="18" fill="#ff9900"/>
  <text x="1445" y="61" text-anchor="middle" style="font:700 14px 'Segoe UI','Noto Sans KR',sans-serif;fill:#232f3e">AWS · us-west-2</text>

