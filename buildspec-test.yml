version: 0.2

# 배포 전 품질·보안 게이트.
# 빠르고 결정적인 검사(lint·SAST·의존성 CVE·시크릿·단위 테스트)를 먼저 돌려
# fail-fast하고, 통과 시에만 느리고 비용이 드는 LLM 평가를 실행합니다.

phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      # uv로 잠긴 의존성을 그대로 설치해 CI와 로컬 환경 드리프트를 방지합니다.
      - pip install uv==0.10.6
      - uv sync --frozen
  pre_build:
    commands:
      # 1) 린트
      - uv run ruff check .
      # 2) SAST — 애플리케이션·운영·스크립트 코드 정적 분석
      - uv run bandit -c pyproject.toml -q -r app ops scripts
      # 3) 의존성 취약점(CVE) 검사
      - uv run pip-audit
      # 4) 시크릿 스캔 — baseline에 없는 새 시크릿이 있으면 실패(.git 불필요)
      - uv run python scripts/check_secrets.py
      # 5) 결정적 보안 단위 테스트(입력 검증·예약 안전) — 네트워크 불필요
      - uv run pytest tests/test_tools_security.py -q
  build:
    commands:
      # 6) LLM 품질·보안 평가 게이트 — 미달 시 exit 1로 배포 차단
      - uv run python tests/eval_gate.py
