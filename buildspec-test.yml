version: 0.2

# Agent·SAM API·Cloudscape Frontend 전체를 배포 전에 검사하는 fail-fast 게이트.
env:
  variables:
    UV_VERSION: '0.10.6'
    SAM_CLI_VERSION: '1.164.0'
    TEST_API_URL: 'https://example.invalid'

phases:
  install:
    runtime-versions:
      nodejs: 22
      python: 3.13
    commands:
      - pip install "uv==$UV_VERSION"
      - uv sync --frozen
      - npm ci --prefix labs/dining-web/frontend --ignore-scripts || npm install --prefix labs/dining-web/frontend --ignore-scripts
  pre_build:
    commands:
      # Agent + API Python 품질·보안 검사
      - uv run ruff check .
      - uv run bandit -c pyproject.toml -q -r app ops scripts labs/dining-web/api
      - uv run pip-audit
      - uv run python scripts/check_secrets.py
      - uv run pytest tests/test_tools_security.py tests/test_thinking_filter.py -q
      - uv run python scripts/check_docs.py
      # SAM 및 호스팅·파이프라인 CloudFormation 템플릿 검사
      - uvx --from "aws-sam-cli==$SAM_CLI_VERSION" sam validate --lint --region "$AWS_REGION" --template-file labs/dining-web/template.yaml
      - uvx --from "aws-sam-cli==$SAM_CLI_VERSION" sam validate --lint --region "$AWS_REGION" --template-file infra/dining-web/hosting.yaml
      - uvx --from "aws-sam-cli==$SAM_CLI_VERSION" sam validate --lint --region "$AWS_REGION" --template-file infra/dining-web/pipeline.yaml
      - uvx --from "aws-sam-cli==$SAM_CLI_VERSION" sam build --template-file labs/dining-web/template.yaml --build-dir labs/dining-web/.aws-sam-ci/build
      # Frontend 정적 검사와 프로덕션 번들 빌드
      - npm run lint --prefix labs/dining-web/frontend
      - VITE_API_URL="$TEST_API_URL" npm run build --prefix labs/dining-web/frontend
  build:
    commands:
      # 결정적 검사를 모두 통과한 뒤에만 비용이 드는 LLM 품질·보안 평가 실행
      - uv run python tests/eval_gate.py

cache:
  paths:
    - '/root/.cache/uv/**/*'
    - '/root/.npm/**/*'
