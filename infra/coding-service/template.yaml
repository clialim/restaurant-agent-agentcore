AWSTemplateFormatVersion: '2010-09-09'
Description: S3 Files shared audit storage for AgentCore CodingService

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetAId:
    Type: AWS::EC2::Subnet::Id
  PrivateSubnetBId:
    Type: AWS::EC2::Subnet::Id

Resources:
  WorkLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: RestaurantAgent
        - Key: Component
          Value: CodingService

  S3FilesBucketRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3FilesAssumeRole
            Effect: Allow
            Principal:
              Service: elasticfilesystem.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:s3files:${AWS::Region}:${AWS::AccountId}:file-system/*
      Policies:
        - PolicyName: CodingServiceS3FilesBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: BucketPermissions
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource: !GetAtt WorkLogBucket.Arn
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: ObjectPermissions
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject*
                  - s3:GetObject*
                  - s3:List*
                  - s3:PutObject*
                Resource: !Sub ${WorkLogBucket.Arn}/*
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: EventBridgeManage
                Effect: Allow
                Action:
                  - events:DeleteRule
                  - events:DisableRule
                  - events:EnableRule
                  - events:PutRule
                  - events:PutTargets
                  - events:RemoveTargets
                Resource: !Sub arn:${AWS::Partition}:events:*:${AWS::AccountId}:rule/DO-NOT-DELETE-S3-Files*
                Condition:
                  StringEquals:
                    events:ManagedBy: elasticfilesystem.amazonaws.com
              - Sid: EventBridgeRead
                Effect: Allow
                Action:
                  - events:DescribeRule
                  - events:ListRuleNamesByTarget
                  - events:ListRules
                  - events:ListTargetsByRule
                Resource: !Sub arn:${AWS::Partition}:events:*:${AWS::AccountId}:rule/*

  RuntimeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AgentCore CodingService runtime egress
      VpcId: !Ref VpcId
      SecurityGroupEgress: []
      Tags:
        - Key: Name
          Value: coding-service-runtime

  MountTargetSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: S3 Files mount targets for CodingService
      VpcId: !Ref VpcId
      SecurityGroupEgress: []
      Tags:
        - Key: Name
          Value: coding-service-s3files

  RuntimeHttpsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt RuntimeSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: Bedrock, ECR, S3 and GitHub through NAT or VPC endpoints

  RuntimeNfsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt RuntimeSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      DestinationSecurityGroupId: !GetAtt MountTargetSecurityGroup.GroupId
      Description: NFSv4.2 to S3 Files mount targets

  MountTargetNfsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !GetAtt MountTargetSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      SourceSecurityGroupId: !GetAtt RuntimeSecurityGroup.GroupId
      Description: NFSv4.2 from AgentCore Runtime

  WorkLogFileSystem:
    Type: AWS::S3Files::FileSystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !GetAtt WorkLogBucket.Arn
      Prefix: coding-service/
      RoleArn: !GetAtt S3FilesBucketRole.Arn
      AcceptBucketWarning: true
      Tags:
        - Key: Project
          Value: RestaurantAgent
        - Key: Component
          Value: CodingService

  MountTargetA:
    Type: AWS::S3Files::MountTarget
    Properties:
      FileSystemId: !GetAtt WorkLogFileSystem.FileSystemId
      SubnetId: !Ref PrivateSubnetAId
      IpAddressType: IPV4_ONLY
      SecurityGroups:
        - !GetAtt MountTargetSecurityGroup.GroupId

  MountTargetB:
    Type: AWS::S3Files::MountTarget
    Properties:
      FileSystemId: !GetAtt WorkLogFileSystem.FileSystemId
      SubnetId: !Ref PrivateSubnetBId
      IpAddressType: IPV4_ONLY
      SecurityGroups:
        - !GetAtt MountTargetSecurityGroup.GroupId

  WorkLogAccessPoint:
    Type: AWS::S3Files::AccessPoint
    DependsOn:
      - MountTargetA
      - MountTargetB
    Properties:
      FileSystemId: !GetAtt WorkLogFileSystem.FileSystemId
      PosixUser:
        Uid: '1000'
        Gid: '1000'
      RootDirectory:
        Path: /work-logs
        CreationPermissions:
          OwnerUid: '1000'
          OwnerGid: '1000'
          Permissions: '0750'
      Tags:
        - Key: Project
          Value: RestaurantAgent
        - Key: Component
          Value: CodingService

Outputs:
  VpcId:
    Value: !Ref VpcId
  WorkLogBucketName:
    Value: !Ref WorkLogBucket
  WorkLogPrefix:
    Value: coding-service/work-logs/
  S3FilesAccessPointArn:
    Value: !GetAtt WorkLogAccessPoint.AccessPointArn
  RuntimeSecurityGroupId:
    Value: !GetAtt RuntimeSecurityGroup.GroupId
  PrivateSubnetIds:
    Value: !Join [',', [!Ref PrivateSubnetAId, !Ref PrivateSubnetBId]]
