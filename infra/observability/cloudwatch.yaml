AWSTemplateFormatVersion: "2010-09-09"
Description: >
  RestaurantAgent 관찰성 - AgentCore Runtime CloudWatch 알람/대시보드/알림.
  AgentCore Runtime은 AWS/Bedrock-AgentCore 네임스페이스로 메트릭을 발행합니다
  (Invocations, Throttles, SystemErrors, UserErrors, Latency, ActiveSessionCount).
  이 템플릿은 콘솔에서 수동 생성했던 모니터링을 코드로 재현 가능하게 만듭니다.

Parameters:
  AlarmEmail:
    Type: String
    Description: 알람 통지를 받을 이메일 (SNS 구독 확인 필요)
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  AgentLogGroupName:
    Type: String
    Default: /aws/bedrock-agentcore/runtimes/RestaurantAgent_RestaurantAgent-b4sWcjH7j6-DEFAULT
    Description: AgentCore Runtime 애플리케이션 로그 그룹 이름
  LogRetentionDays:
    Type: Number
    Default: 30
    Description: 로그 보존 기간(일)
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]
  LatencyThresholdMs:
    Type: Number
    Default: 15000
    Description: p99 지연 알람 임계값(ms)
  ActiveSessionSpikeThreshold:
    Type: Number
    Default: 50
    Description: 동시 활성 세션 급증 알람 임계값

Resources:
  # 알람 통지 채널 -----------------------------------------------------------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: restaurant-agent-alerts
      DisplayName: RestaurantAgent Alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref AlarmEmail
      TopicArn: !Ref AlertTopic

  # 로그 보존 정책 -----------------------------------------------------------
  # AgentCore가 생성하는 vended 로그 그룹에 보존 기간을 명시적으로 적용합니다.
  AgentLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Ref AgentLogGroupName
      RetentionInDays: !Ref LogRetentionDays

  # 알람 --------------------------------------------------------------------
  SystemErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: restaurant-agent-system-errors
      AlarmDescription: 서버측 오류(SystemErrors) 발생 - 인프라/서비스 문제 신호
      Namespace: AWS/Bedrock-AgentCore
      MetricName: SystemErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  ThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: restaurant-agent-throttles
      AlarmDescription: 요청 쓰로틀 발생 - 쿼터/TPS 한도 검토 필요
      Namespace: AWS/Bedrock-AgentCore
      MetricName: Throttles
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  LatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: restaurant-agent-latency-p99
      AlarmDescription: p99 응답 지연이 임계값을 초과
      Namespace: AWS/Bedrock-AgentCore
      MetricName: Latency
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 3
      Threshold: !Ref LatencyThresholdMs
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  ActiveSessionSpikeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: restaurant-agent-active-session-spike
      AlarmDescription: 동시 활성 세션 급증 - 비정상 사용/남용 가능성
      Namespace: AWS/Bedrock-AgentCore
      MetricName: ActiveSessionCount
      Dimensions:
        - Name: Service
          Value: AgentCore.Runtime
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: !Ref ActiveSessionSpikeThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # 대시보드 ----------------------------------------------------------------
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: restaurant-agent-observability
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Invocations / Errors",
                "region": "${AWS::Region}",
                "stacked": false,
                "metrics": [
                  [ "AWS/Bedrock-AgentCore", "Invocations", { "stat": "Sum" } ],
                  [ "AWS/Bedrock-AgentCore", "SystemErrors", { "stat": "Sum" } ],
                  [ "AWS/Bedrock-AgentCore", "UserErrors", { "stat": "Sum" } ],
                  [ "AWS/Bedrock-AgentCore", "Throttles", { "stat": "Sum" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Latency (p50/p99)",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/Bedrock-AgentCore", "Latency", { "stat": "p50" } ],
                  [ "AWS/Bedrock-AgentCore", "Latency", { "stat": "p99" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Active Sessions",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/Bedrock-AgentCore", "ActiveSessionCount", "Service", "AgentCore.Runtime", { "stat": "Maximum" } ]
                ]
              }
            }
          ]
        }

Outputs:
  AlertTopicArn:
    Description: 알람 통지 SNS 토픽 ARN
    Value: !Ref AlertTopic
  DashboardName:
    Description: CloudWatch 대시보드 이름
    Value: !Ref Dashboard
