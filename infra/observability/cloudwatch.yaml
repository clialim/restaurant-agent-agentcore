AWSTemplateFormatVersion: "2010-09-09"
Description: >
  RestaurantAgent 관찰성 - AgentCore Runtime CloudWatch 알람/대시보드/알림.
  AgentCore Runtime은 AWS/Bedrock-AgentCore 네임스페이스로 메트릭을 발행합니다
  (Invocations, Throttles, SystemErrors, UserErrors, Latency, ActiveSessionCount).
  이 템플릿은 콘솔에서 수동 생성했던 모니터링을 코드로 재현 가능하게 만듭니다.
  AgentCore가 소유하는 vended 로그 그룹은 이 스택에서 생성하지 않으며,
  보존 기간은 별도 CLI로 설정합니다(README 참고).

Parameters:
  AlarmEmail:
    Type: String
    Default: ""
    Description: >
      알람 통지를 받을 이메일. 비워두면 이메일 구독을 생성하지 않습니다
      (SNS 이메일 구독을 차단하는 계정에서도 배포 가능). 형식 검증은 SNS가 수행합니다.
  LatencyThresholdMs:
    Type: Number
    Default: 15000
    Description: p99 지연 알람 임계값(ms)
  ActiveSessionSpikeThreshold:
    Type: Number
    Default: 50
    Description: 동시 활성 세션 급증 알람 임계값

Conditions:
  # 이메일이 제공된 경우에만 이메일 구독을 생성합니다.
  HasEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:
  # 알람 통지 채널 -----------------------------------------------------------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: restaurant-agent-alerts
      DisplayName: RestaurantAgent Alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      Protocol: email
      Endpoint: !Ref AlarmEmail
      TopicArn: !Ref AlertTopic

  # 내구성 알림 싱크 - 알람 통지를 잃지 않도록 SQS로 보관합니다.
  # 이메일 구독이 불가한 계정에서도 토픽에 엔드포인트를 제공해,
  # 통지가 유실되지 않고 다운스트림(Lambda/티켓팅 등)에서 소비할 수 있게 합니다.
  AlertQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: restaurant-agent-alerts
      MessageRetentionPeriod: 1209600  # 14일

  AlertQueueSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: sqs
      Endpoint: !GetAtt AlertQueue.Arn
      TopicArn: !Ref AlertTopic
      RawMessageDelivery: true

  AlertQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref AlertQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSNSPublish
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: "sqs:SendMessage"
            Resource: !GetAtt AlertQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref AlertTopic

  # 참고: AgentCore Runtime이 생성하는 vended 로그 그룹
  # (/aws/bedrock-agentcore/runtimes/<id>-<endpoint>)은 서비스가 소유하므로
  # 이 스택에서 새로 만들지 않습니다. 보존 기간은 멱등한 CLI로 설정합니다:
  #   aws logs put-retention-policy --log-group-name <name> --retention-in-days 30

  # 알람 --------------------------------------------------------------------
  SystemErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: restaurant-agent-system-errors
      AlarmDescription: 서버측 오류(SystemErrors) 발생 - 인프라/서비스 문제 신호
      Namespace: AWS/Bedrock-AgentCore
      MetricName: SystemErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  ThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: restaurant-agent-throttles
      AlarmDescription: 요청 쓰로틀 발생 - 쿼터/TPS 한도 검토 필요
      Namespace: AWS/Bedrock-AgentCore
      MetricName: Throttles
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  LatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: restaurant-agent-latency-p99
      AlarmDescription: p99 응답 지연이 임계값을 초과
      Namespace: AWS/Bedrock-AgentCore
      MetricName: Latency
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 3
      Threshold: !Ref LatencyThresholdMs
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  ActiveSessionSpikeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: restaurant-agent-active-session-spike
      AlarmDescription: 동시 활성 세션 급증 - 비정상 사용/남용 가능성
      Namespace: AWS/Bedrock-AgentCore
      MetricName: ActiveSessionCount
      Dimensions:
        - Name: Service
          Value: AgentCore.Runtime
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: !Ref ActiveSessionSpikeThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # 대시보드 ----------------------------------------------------------------
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: restaurant-agent-observability
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Invocations / Errors",
                "region": "${AWS::Region}",
                "stacked": false,
                "metrics": [
                  [ "AWS/Bedrock-AgentCore", "Invocations", { "stat": "Sum" } ],
                  [ "AWS/Bedrock-AgentCore", "SystemErrors", { "stat": "Sum" } ],
                  [ "AWS/Bedrock-AgentCore", "UserErrors", { "stat": "Sum" } ],
                  [ "AWS/Bedrock-AgentCore", "Throttles", { "stat": "Sum" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Latency (p50/p99)",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/Bedrock-AgentCore", "Latency", { "stat": "p50" } ],
                  [ "AWS/Bedrock-AgentCore", "Latency", { "stat": "p99" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Active Sessions",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/Bedrock-AgentCore", "ActiveSessionCount", "Service", "AgentCore.Runtime", { "stat": "Maximum" } ]
                ]
              }
            }
          ]
        }

Outputs:
  AlertTopicArn:
    Description: 알람 통지 SNS 토픽 ARN
    Value: !Ref AlertTopic
  AlertQueueUrl:
    Description: 알림을 보관하는 SQS 큐 URL
    Value: !Ref AlertQueue
  DashboardName:
    Description: CloudWatch 대시보드 이름
    Value: !Ref Dashboard
