[project]
name = "restaurant-agent-agentcore"
version = "0.1.0"
description = "Strands 기반 RestaurantAgent의 Amazon Bedrock AgentCore 배포 및 운영 실습"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bedrock-agentcore==1.19.0",
    "strands-agents==1.50.2",
    "strands-agents-evals>=1.0.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.bandit]
# 가상환경·생성물은 정적 분석 대상에서 제외합니다.
exclude_dirs = [".venv", "app/RestaurantAgent/.venv", "agentcore/cdk", "node_modules"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[dependency-groups]
dev = [
    "ruff==0.16.0",
    "pytest==9.0.3",
    "bandit==1.8.6",
    "pip-audit==2.9.0",
    "detect-secrets==1.5.0",
]
