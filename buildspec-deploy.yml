version: 0.2

env:
  variables:
    AGENTCORE_CLI_VERSION: '0.25.0'
    UV_VERSION: '0.10.6'
    AGENT_RUNTIME_NAME: 'RestaurantAgent_RestaurantAgent'
  exported-variables:
    - AGENT_RUNTIME_ARN

phases:
  install:
    runtime-versions:
      nodejs: 22
      python: 3.13
    commands:
      - npm install -g "@aws/agentcore@$AGENTCORE_CLI_VERSION"
      - pip install "uv==$UV_VERSION"
  build:
    commands:
      # 검증된 기존 AgentCore 배포 권한으로 비대화식 배포합니다.
      - agentcore deploy -y -v
      # 후속 SAM API 단계가 동일 실행에서 방금 배포된 런타임 ARN을 사용하도록 export합니다.
      - AGENT_RUNTIME_ARN=$(aws bedrock-agentcore-control list-agent-runtimes --region "$AWS_REGION" --query "agentRuntimes[?agentRuntimeName=='$AGENT_RUNTIME_NAME'].agentRuntimeArn | [0]" --output text)
      - test -n "$AGENT_RUNTIME_ARN" && test "$AGENT_RUNTIME_ARN" != "None"
      - export AGENT_RUNTIME_ARN
      - echo "Agent runtime ARN exported for the next action"
